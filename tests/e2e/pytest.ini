[pytest]
testpaths = .
python_files = test_*.py
markers =
    phase1: Phase 1 backend MVP flow (requires compose)
    k: Client UI scenario K1-K8 (API-level)
    a: Admin UI scenario A1-A9 (API-level)
    notion: Requires NOTION_E2E_TOKEN (real Notion API)
    db: Verifies PostgreSQL via docker compose exec
addopts = -ra --strict-markers
