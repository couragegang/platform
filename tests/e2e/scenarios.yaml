# Карта E2E-сценариев → тесты (см. cursor-context/docs/ui-api-scenarios.md §13)
# phase: 1 = backend без UI, 2 = с UI (часть API уже покрыта на фазе 1)

phase1:
  P1-01:
    title: Health всех сервисов
    tests: test_health.py
  P1-02:
    title: Register + org + default workspace (IAM → config)
    tests: test_phase1_flow.py::test_register_creates_org_and_default_workspace
  P1-03:
    title: Login + refresh
    tests: test_phase1_flow.py::test_login_and_refresh
  P1-04:
    title: BFF JWT + catalog + chat
    tests: test_phase1_flow.py::test_bff_catalog_and_chat
  P1-05:
    title: MCP install (secrets + policy) + list + delete
    tests: test_phase1_flow.py::test_mcp_install_lifecycle
  P1-06:
    title: DB — token не в connection_config, есть policy + audit
    tests: test_phase1_flow.py::test_install_persists_secrets_policy_audit
    markers: [db]

client:
  K1:
