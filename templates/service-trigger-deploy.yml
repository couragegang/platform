# Скопировать в каждый микросервис: .github/workflows/trigger-deploy.yml
# Требование: в couragegang/platform → Settings → Actions → General →
#   "Accessible from repositories in the 'couragegang' organization"
# Секрет PLATFORM_DEPLOY_TOKEN больше не нужен (legacy: repository_dispatch).

name: Trigger platform deploy

on:
  push:
    branches: [main, test]

jobs:
  deploy:
    uses: couragegang/platform/.github/workflows/deploy-vps.yml@${{ github.ref_name }}
    with:
      contour: ${{ github.ref == 'refs/heads/main' && 'prod' || 'test' }}
      service_repo: ${{ github.event.repository.name }}
      sha: ${{ github.sha }}
      trigger_repository: ${{ github.repository }}
