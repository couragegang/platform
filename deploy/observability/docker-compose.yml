# Observability VPS: Grafana + два Prometheus (test / prod scrape).
# Local: docker-compose.local.yml (один Prometheus). См. up.sh OBSERVABILITY_PROFILE.
name: couragegang-observability

x-prometheus-common: &prometheus-common
  image: prom/prometheus:v2.55.1
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=15d
    - --web.enable-lifecycle

services:
  prometheus-test:
    <<: *prometheus-common
    volumes:
      - ./prometheus/scrape-test.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-test-data:/prometheus

  prometheus-prod:
    <<: *prometheus-common
    volumes:
      - ./prometheus/scrape-prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-prod-data:/prometheus

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    depends_on:
      - prometheus-test
      - prometheus-prod
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme-set-in-env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_INSTALL_PLUGINS: ""
    volumes:
      # Только VPS-файлы (не монтировать всю provisioning/: datasources.local.yml даёт второй isDefault → crash)
      - ./grafana/provisioning/datasources/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./grafana/provisioning/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"

volumes:
  prometheus-test-data:
  prometheus-prod-data:
  grafana-data:
