# Host-порты prod (8080–8088). Базовый docker-compose.yml без ports — см. up.sh.
# Не смешивать с ports-test на одном VPS.

services:
  iam:
    ports: ["8080:8080"]
  mcp:
    ports: ["8081:8081"]
  bff:
    ports: ["8082:8082"]
  ai:
    ports: ["8083:8083"]
    environment:
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
  config:
    ports: ["8084:8084"]
  policy:
    ports: ["8085:8085"]
  audit:
    ports: ["8086:8086"]
  secrets:
    ports: ["8087:8087"]
  knowledge:
    ports: ["8088:8088"]
  n8n:
    ports: ["5678:5678"]
    environment:
      N8N_PATH: /n8n/
      N8N_EDITOR_BASE_URL: https://ai.valoriel.ru/n8n/
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://ai.valoriel.ru/n8n/
      N8N_PROXY_HOPS: "1"
  mcp-notion:
    ports: ["8091:8091"]
  mcp-trello:
    ports: ["8092:8092"]
