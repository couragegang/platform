# Порты только здесь — в базовом compose нет ports (иначе Compose дописывает 808x + 1808x).

services:
  iam:
    ports: ["18080:8080"]
  mcp:
    ports: ["18081:8081"]
  bff:
    ports: ["18082:8082"]
  ai:
    ports: ["18083:8083"]
  config:
    ports: ["18084:8084"]
  policy:
    ports: ["18085:8085"]
  audit:
    ports: ["18086:8086"]
  secrets:
    ports: ["18087:8087"]
  knowledge:
    ports: ["18088:8088"]
