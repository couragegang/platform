# Host-порты test (18080–18088) на том же VPS, что и prod.
# Порты только здесь — в базовом compose нет ports (иначе Compose дописывает 808x + 1808x).

services:
  iam:
    ports: ["18080:8080"]
  mcp:
    ports: ["18081:8081"]
  bff:
    ports: ["18082:8082"]
  ai:
    ports: ["18083:8083"]
    # В образе baked env; JAVA_TOOL_OPTIONS здесь — без пересборки ai (Java → n8n по IPv4)
    environment:
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
  config:
    ports: ["18084:8084"]
  policy:
    ports: ["18085:8085"]
  audit:
    ports: ["18086:8086"]
  secrets:
    ports: ["18087:8087"]
  knowledge:
    ports: ["18088:8088"]
  n8n:
    ports: ["15678:5678"]
    environment:
      N8N_PATH: /n8n/
      N8N_EDITOR_BASE_URL: https://ai-test.valoriel.ru/n8n/
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://ai-test.valoriel.ru/n8n/
      N8N_PROXY_HOPS: "1"
  mcp-notion:
    ports: ["18091:8091"]
  mcp-trello:
    ports: ["18092:8092"]
