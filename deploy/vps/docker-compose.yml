# VPS: pull готовых образов. Теги — image-tags.env (см. up.sh).
# Host-порты — только в docker-compose.ports-prod.yml / docker-compose.ports-test.yml (см. up.sh).
# Fallback: IMAGE_TAG или <contour>-latest

name: couragegang-${DEPLOY_CONTOUR:-prod}

services:
  postgres:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-couragegang}/platform-postgres:${IMAGE_TAG_POSTGRES:-${IMAGE_TAG:-${DEPLOY_CONTOUR:-prod}-latest}}
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 3s
      retries: 12

  config:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-couragegang}/config-service:${IMAGE_TAG_CONFIG:-${IMAGE_TAG:-${DEPLOY_CONTOUR:-prod}-latest}}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  policy:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-couragegang}/policy-service:${IMAGE_TAG_POLICY:-${IMAGE_TAG:-${DEPLOY_CONTOUR:-prod}-latest}}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  secrets:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-couragegang}/secrets-service:${IMAGE_TAG_SECRETS:-${IMAGE_TAG:-${DEPLOY_CONTOUR:-prod}-latest}}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  audit:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-couragegang}/audit-service:${IMAGE_TAG_AUDIT:-${IMAGE_TAG:-${DEPLOY_CONTOUR:-prod}-latest}}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  iam:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-couragegang}/iam-service:${IMAGE_TAG_IAM:-${IMAGE_TAG:-${DEPLOY_CONTOUR:-prod}-latest}}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      config:
        condition: service_started

  mcp-notion:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-couragegang}/mcp-notion:${IMAGE_TAG_MCP_NOTION:-${IMAGE_TAG:-${DEPLOY_CONTOUR:-prod}-latest}}
    restart: unless-stopped

  mcp:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-couragegang}/mcp-gateway:${IMAGE_TAG_MCP:-${IMAGE_TAG:-${DEPLOY_CONTOUR:-prod}-latest}}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      policy:
        condition: service_started
      secrets:
        condition: service_started
      audit:
        condition: service_started
      mcp-notion:
        condition: service_started

  knowledge:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-couragegang}/knowledge-service:${IMAGE_TAG_KNOWLEDGE:-${IMAGE_TAG:-${DEPLOY_CONTOUR:-prod}-latest}}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-couragegang}/n8n:${IMAGE_TAG_N8N:-${IMAGE_TAG:-${DEPLOY_CONTOUR:-prod}-latest}}
    restart: unless-stopped
    volumes:
      - n8n_data:/home/node/.n8n

  ai:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-couragegang}/ai-runtime:${IMAGE_TAG_AI:-${IMAGE_TAG:-${DEPLOY_CONTOUR:-prod}-latest}}
    restart: unless-stopped
    depends_on:
      - iam
      - policy
      - n8n

  bff:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-couragegang}/bff-gateway:${IMAGE_TAG_BFF:-${IMAGE_TAG:-${DEPLOY_CONTOUR:-prod}-latest}}
    restart: unless-stopped
    depends_on:
      - iam
      - mcp
      - ai
      - config
      - policy
      - audit
      - knowledge

volumes:
  pgdata:
  n8n_data:
