# ai.valoriel.ru — reverse proxy к couragegang stack (prod на localhost:8080–8088).
# По аналогии с iceberg/deploy/nginx-iceberg-proxy.example.conf: фрагменты location
# вставляются в существующий server { } для ai.valoriel.ru (TLS уже настроен — новый certbot не нужен).
#
# Минимум для браузера и OIDC:
#   /v1/bff/*  → BFF (единая точка API для UI)
#   /v1/iam/*  → IAM (login/register + OIDC callback — redirect URI в GitHub: VPS_PUBLIC_BASE_URL)
#
# НЕ выносить в интернет: secrets (8087), config/policy/audit/mcp/ai напрямую — только через BFF или VPN.

upstream ai_bff {
    server 127.0.0.1:8082;
    keepalive 8;
}

upstream ai_iam {
    server 127.0.0.1:8080;
    keepalive 8;
}

# --- вставить в server { listen 443 ssl; server_name ai.valoriel.ru; ... } ---

location /v1/bff/ {
    proxy_pass http://ai_bff;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
}

location /v1/iam/ {
    proxy_pass http://ai_iam;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
}

# Опционально: быстрая проверка после деплоя (BFF health)
location = /health {
    proxy_pass http://ai_bff/v1/bff/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

