# ai-test.valoriel.ru — staging: те же правила, Docker test-порты 18080/18082.

upstream ai_bff_test {
    server 127.0.0.1:18082;
    keepalive 8;
}

upstream ai_iam_test {
    server 127.0.0.1:18080;
    keepalive 8;
}

upstream ai_grafana {
    server 127.0.0.1:3000;
    keepalive 8;
}

server {
    server_name ai-test.valoriel.ru;
    root /var/www/ai-test.valoriel.ru;
    index index.html;

    client_max_body_size 32m;

    location /api/ {
        proxy_pass http://ai_bff_test/v1/bff/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /v1/iam/ {
        proxy_pass http://ai_iam_test;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location = /health {
        proxy_pass http://ai_bff_test/v1/bff/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /grafana {
        return 301 $scheme://$host/grafana/;
    }

    location /grafana/ {
        proxy_pass http://ai_grafana/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl http2;
    ssl_certificate /var/www/httpd-cert/www-root/ai-test.valoriel.ru_le1.crtca;
    ssl_certificate_key /var/www/httpd-cert/www-root/ai-test.valoriel.ru_le1.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name ai-test.valoriel.ru;
    return 301 https://ai-test.valoriel.ru$request_uri;
}
