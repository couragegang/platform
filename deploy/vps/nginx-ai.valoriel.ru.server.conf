# ai.valoriel.ru — SPA (static) + /api → BFF, /api/auth → IAM, /v1/iam → OIDC callbacks.
# TLS: ISPmanager → /var/www/httpd-cert/www-root/ai.valoriel.ru_le1.{crtca,key}
# Static root: /var/www/ai.valoriel.ru (npm run build → rsync dist/)

upstream ai_bff {
    server 127.0.0.1:8082;
    keepalive 8;
}

upstream ai_iam {
    server 127.0.0.1:8080;
    keepalive 8;
}

upstream ai_grafana {
    server 127.0.0.1:3000;
    keepalive 8;
}

server {
    server_name ai.valoriel.ru;
    root /var/www/ai.valoriel.ru;
    index index.html;

    client_max_body_size 32m;

    # Весь /api/* → BFF (/v1/bff/api/*). Auth: /api/auth/* проксируется BFF → IAM.
    location /api/ {
        proxy_pass http://ai_bff/v1/bff/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # OIDC callbacks (Google/GitHub) — URL зашиты в IAM при bake
    location /v1/iam/ {
        proxy_pass http://ai_iam;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://ai_bff/v1/bff/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Grafana (localhost:3000). В Grafana: GF_SERVER_ROOT_URL=https://ai.valoriel.ru/grafana/ GF_SERVER_SERVE_FROM_SUB_PATH=true
    location = /grafana {
        return 301 $scheme://$host/grafana/;
    }

    location /grafana/ {
        proxy_pass http://ai_grafana/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl http2;
    ssl_certificate /var/www/httpd-cert/www-root/ai.valoriel.ru_le1.crtca;
    ssl_certificate_key /var/www/httpd-cert/www-root/ai.valoriel.ru_le1.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name ai.valoriel.ru;
    return 301 https://ai.valoriel.ru$request_uri;
}
