# Satisfies "1 approval" on protected test/main for same-repo PRs (solo/small org).
# GitHub does not allow the PR author to approve their own PR; this bot approval counts.
name: Auto-approve internal PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  approve:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: hmarr/auto-approve-action@v4
