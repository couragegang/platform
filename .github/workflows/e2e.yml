name: E2E integration tests

on:
  push:
    branches: [test, main]
  pull_request:
    branches: [test, main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: test
    env:
      DEPLOY_CONTOUR: test
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SECRETS_ENCRYPTION_KEY: ${{ secrets.SECRETS_ENCRYPTION_KEY }}
      CONFIG_INTERNAL_API_KEY: ${{ secrets.CONFIG_INTERNAL_API_KEY }}
      POLICY_INTERNAL_API_KEY: ${{ secrets.POLICY_INTERNAL_API_KEY }}
      SECRETS_INTERNAL_API_KEY: ${{ secrets.SECRETS_INTERNAL_API_KEY }}
      AUDIT_INTERNAL_API_KEY: ${{ secrets.AUDIT_INTERNAL_API_KEY }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve test suite (smoke vs regress)
        id: suite
        run: |
          chmod +x scripts/*.sh
          source scripts/resolve-functional-suite.sh
          echo "suite=$SUITE" >> "$GITHUB_OUTPUT"

      - name: Checkout microservices
        run: ./scripts/checkout-services.sh

      - name: Prepare runtime secrets (contour test)
        run: ./scripts/fetch-build-secrets.sh test

      - name: Build and start stack
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker compose up -d --build
          echo "Waiting for services..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/v1/iam/health \
              && curl -sf http://localhost:8081/v1/mcp/health \
              && curl -sf http://localhost:8082/v1/bff/health \
              && curl -sf http://localhost:8083/v1/ai/health \
              && curl -sf http://localhost:8084/v1/config/health \
              && curl -sf http://localhost:8085/v1/policy/health \
              && curl -sf http://localhost:8086/v1/audit/health \
              && curl -sf http://localhost:8087/v1/secrets/health \
              && curl -sf http://localhost:8088/v1/knowledge/health; then
              echo "All healthy"
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=80
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        working-directory: tests/e2e
        run: pip install -r requirements.txt

      - name: Smoke tests
        working-directory: tests/e2e
        run: pytest -m smoke --tb=short -q

      - name: Regress tests
        if: steps.suite.outputs.suite == 'regress'
        working-directory: tests/e2e
        run: pytest -m regress --tb=short -q

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Tear down
        if: always()
        run: docker compose down -v
