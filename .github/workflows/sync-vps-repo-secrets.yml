name: Sync VPS secrets to repository

# Одноразово / по необходимости: копирует VPS_* из Environment → Repository secrets
# (нужно для workflow_call из ui/BC в deploy-web-ui / cross-repo reusable workflows).

on:
  workflow_dispatch:
    inputs:
      contour:
        description: Source environment (test or prod)
        required: true
        default: test
        type: choice
        options:
          - test
          - prod

jobs:
  sync:
    permissions:
      contents: read
      secrets: write
    runs-on: ubuntu-latest
    environment: ${{ inputs.contour }}
    steps:
      - name: Copy VPS_* to repository secrets
        env:
          GH_TOKEN: ${{ github.token }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_SSH_KEY; do
            val="${!name:-}"
            if [[ -z "$val" ]]; then
              echo "Missing $name in Environment '${{ inputs.contour }}'" >&2
              exit 1
            fi
            printf '%s' "$val" | gh secret set "$name" --repo "${{ github.repository }}"
            echo "Set repository secret $name"
          done
          if [[ -n "${VPS_SSH_PORT:-}" ]]; then
            printf '%s' "$VPS_SSH_PORT" | gh secret set VPS_SSH_PORT --repo "${{ github.repository }}"
            echo "Set repository secret VPS_SSH_PORT"
          fi
