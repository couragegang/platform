name: Sync VPS secrets to repository

# Копирует VPS_* из Environment test/prod → Repository secrets (для workflow_call из ui/BC).

on:
  workflow_dispatch:
    inputs:
      contour:
        description: Source environment (test or prod)
        required: true
        default: test
        type: choice
        options:
          - test
          - prod

permissions: write-all

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: ${{ inputs.contour }}
    steps:
      - name: Copy VPS_* to repository secrets
        env:
          GH_TOKEN: ${{ github.token }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_SSH_KEY; do
            val="${!name:-}"
            if [[ -z "$val" ]]; then
              echo "Missing $name in Environment '${{ inputs.contour }}'" >&2
              exit 1
            fi
            printf '%s' "$val" | gh secret set "$name" --repo "${{ github.repository }}"
            echo "Set repository secret $name"
          done
