# Полный контур MVP (фаза 1 backend)
# Запуск:
#   .\scripts\fetch-build-secrets.ps1 -Contour local
#   docker compose up --build
#   # или: .\scripts\build-stack.ps1 -Contour local -Up -Detach
#
# Контуры: local | test | prod — см. config/contours/README.md
# Секреты: platform/build/runtime.env (генерируется скриптом, не в git)

x-build-args: &build-args
  DEPLOY_CONTOUR: ${DEPLOY_CONTOUR:-local}

x-runtime-env: &runtime-env
  env_file:
    - path: build/runtime.env
      required: false

# Writable layer + logs (named volumes pgdata/n8n_data are separate).
# size: needs overlay2+xfs pquota on Linux; ignored on Docker Desktop overlay2.
x-container-disk-1g: &container-disk-1g
  storage_opt:
    size: ${DOCKER_CONTAINER_STORAGE_LIMIT:-1G}
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"

services:
  postgres:
    <<: *container-disk-1g
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${DB_PASSWORD:-platform}
      POSTGRES_DB: platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 3s
      timeout: 3s
      retries: 15

  config:
    <<: [*runtime-env, *container-disk-1g]
    build:
      context: ../services/config-service
      dockerfile: Dockerfile
      args:
        <<: *build-args
    ports:
      - "8084:8084"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: config
      DB_USER: platform
      DB_PASSWORD: ${DB_PASSWORD:-platform}
    depends_on:
      postgres:
        condition: service_healthy

  policy:
    <<: [*runtime-env, *container-disk-1g]
    build:
      context: ../services/policy-service
      dockerfile: Dockerfile
      args:
        <<: *build-args
    ports:
      - "8085:8085"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: policy
      DB_USER: platform
      DB_PASSWORD: ${DB_PASSWORD:-platform}
    depends_on:
      postgres:
        condition: service_healthy

  secrets:
    <<: [*runtime-env, *container-disk-1g]
    build:
      context: ../services/secrets-service
      dockerfile: Dockerfile
      args:
        <<: *build-args
    ports:
      - "8087:8087"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: secrets
      DB_USER: platform
      DB_PASSWORD: ${DB_PASSWORD:-platform}
    depends_on:
      postgres:
        condition: service_healthy

  audit:
    <<: [*runtime-env, *container-disk-1g]
    build:
      context: ../services/audit-service
      dockerfile: Dockerfile
      args:
        <<: *build-args
    ports:
      - "8086:8086"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: audit
      DB_USER: platform
      DB_PASSWORD: ${DB_PASSWORD:-platform}
    depends_on:
      postgres:
        condition: service_healthy

  iam:
    <<: [*runtime-env, *container-disk-1g]
    build:
      context: ../services/iam-service
      dockerfile: Dockerfile
      args:
        <<: *build-args
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: iam
      DB_USER: platform
      DB_PASSWORD: ${DB_PASSWORD:-platform}
      CONFIG_SERVICE_ENABLED: "true"
      CONFIG_SERVICE_URL: http://config:8084/v1/config
      OIDC_GOOGLE_REDIRECT_URI: ${OIDC_GOOGLE_REDIRECT_URI:-http://localhost:8080/v1/iam/auth/oidc/google/callback}
      OIDC_GITHUB_REDIRECT_URI: ${OIDC_GITHUB_REDIRECT_URI:-http://localhost:8080/v1/iam/auth/oidc/github/callback}
    depends_on:
      postgres:
        condition: service_healthy
      config:
        condition: service_started

  mcp-notion:
    <<: [*runtime-env, *container-disk-1g]
    build:
      context: ../services/mcp-notion
      dockerfile: Dockerfile
      target: local
      args:
        <<: *build-args
    ports:
      - "8091:8091"
    environment:
      MCP_INTERNAL_API_KEY: ${MCP_INTERNAL_API_KEY:-dev-internal-key}

  mcp-trello:
    <<: [*runtime-env, *container-disk-1g]
    build:
      context: ../services/mcp-trello
      dockerfile: Dockerfile
      target: local
      args:
        <<: *build-args
    ports:
      - "8092:8092"
    environment:
      MCP_INTERNAL_API_KEY: ${MCP_INTERNAL_API_KEY:-dev-internal-key}

  mcp:
    <<: [*runtime-env, *container-disk-1g]
    build:
      context: ../services/mcp-gateway
      dockerfile: Dockerfile
      args:
        <<: *build-args
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: mcp
      DB_USER: platform
      DB_PASSWORD: ${DB_PASSWORD:-platform}
      POLICY_SERVICE_ENABLED: "true"
      POLICY_SERVICE_URL: http://policy:8085/v1/policy
      SECRETS_SERVICE_ENABLED: "true"
      SECRETS_SERVICE_URL: http://secrets:8087/v1/secrets
      AUDIT_SERVICE_ENABLED: "true"
      AUDIT_SERVICE_URL: http://audit:8086/v1/audit
      MCP_INTERNAL_API_KEY: ${MCP_INTERNAL_API_KEY:-dev-internal-key}
      MCP_NOTION_RUNTIME_URL: http://mcp-notion:8091/v1/notion
      MCP_TRELLO_RUNTIME_URL: http://mcp-trello:8092/v1/trello
    depends_on:
      postgres:
        condition: service_healthy
      policy:
        condition: service_started
      secrets:
        condition: service_started
      audit:
        condition: service_started
      mcp-notion:
        condition: service_started
      mcp-trello:
        condition: service_started

  knowledge:
    <<: *container-disk-1g
    build:
      context: ../services/knowledge-service
      dockerfile: Dockerfile
      args:
        <<: *build-args
    ports:
      - "8088:8088"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: knowledge
      DB_USER: platform
      DB_PASSWORD: ${DB_PASSWORD:-platform}
    depends_on:
      postgres:
        condition: service_healthy

  ai:
    <<: [*runtime-env, *container-disk-1g]
    build:
      context: ../services/ai-runtime
      dockerfile: Dockerfile
      args:
        <<: *build-args
    ports:
      - "8083:8083"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ai
      DB_USER: platform
      DB_PASSWORD: ${DB_PASSWORD:-platform}
      POLICY_SERVICE_ENABLED: "true"
      POLICY_SERVICE_URL: http://policy:8085/v1/policy
      AUDIT_SERVICE_ENABLED: "true"
      AUDIT_SERVICE_URL: http://audit:8086/v1/audit
      MCP_SERVICE_ENABLED: "true"
      MCP_SERVICE_URL: http://mcp:8081/v1/mcp
      MCP_INTERNAL_API_KEY: ${MCP_INTERNAL_API_KEY:-dev-internal-key}
      AI_ORCHESTRATOR: ${AI_ORCHESTRATOR:-n8n}
      AI_N8N_ENABLED: ${AI_N8N_ENABLED:-true}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/chat-orchestrator}
      AI_INTERNAL_API_KEY: ${AI_INTERNAL_API_KEY:-dev-internal-key}
      AI_N8N_WAIT_TIMEOUT_SECONDS: ${AI_N8N_WAIT_TIMEOUT_SECONDS:-90}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Djava.net.preferIPv4Stack=true}
    depends_on:
      postgres:
        condition: service_healthy
      iam:
        condition: service_started
      mcp:
        condition: service_started
      policy:
        condition: service_started
      audit:
        condition: service_started
      n8n:
        condition: service_started

  n8n:
    <<: *container-disk-1g
    build:
      context: .
      dockerfile: docker/n8n/Dockerfile
      target: runtime
    entrypoint: ["/docker-entrypoint-custom.sh"]
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${N8N_PUBLIC_WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: Europe/Moscow
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      AI_INTERNAL_API_KEY: ${AI_INTERNAL_API_KEY:-dev-internal-key}
      POLICY_INTERNAL_API_KEY: ${POLICY_INTERNAL_API_KEY:-dev-internal-key}
      MCP_INTERNAL_API_KEY: ${MCP_INTERNAL_API_KEY:-dev-internal-key}
      N8N_TOOL_STEP_WEBHOOK_URL: ${N8N_TOOL_STEP_WEBHOOK_URL:-http://n8n:5678/webhook/chat-tool-step}
      TRELLO_CONNECTOR_MOCK: ${TRELLO_CONNECTOR_MOCK:-false}
    volumes:
      - n8n_data:/home/node/.n8n

  bff:
    <<: *container-disk-1g
    build:
      context: ../services/bff-gateway
      dockerfile: Dockerfile
      args:
        <<: *build-args
    ports:
      - "8082:8082"
    environment:
      IAM_BASE_URL: http://iam:8080/v1/iam
      MCP_BASE_URL: http://mcp:8081
      AI_BASE_URL: http://ai:8083
      POLICY_BASE_URL: http://policy:8085/v1/policy
      AUDIT_BASE_URL: http://audit:8086/v1/audit
      KNOWLEDGE_BASE_URL: http://knowledge:8088/v1/knowledge
      CONFIG_BASE_URL: http://config:8084/v1/config
    depends_on:
      - iam
      - mcp
      - ai
      - config
      - policy
      - audit
      - knowledge

volumes:
  pgdata:
  n8n_data:
