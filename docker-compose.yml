# Полный контур MVP (фаза 1 backend)
# Запуск:
#   .\scripts\fetch-build-secrets.ps1 -Contour local
#   docker compose up --build
#   # или: .\scripts\build-stack.ps1 -Contour local -Up -Detach
#
# Контуры: local | test | prod — см. config/contours/README.md
# Секреты: platform/build/runtime.env (генерируется скриптом, не в git)

x-build-args: &build-args
  DEPLOY_CONTOUR: ${DEPLOY_CONTOUR:-local}

x-runtime-env: &runtime-env
  env_file:
    - path: build/runtime.env
      required: false

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${DB_PASSWORD:-platform}
      POSTGRES_DB: platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 3s
      timeout: 3s
      retries: 15

  config:
    <<: *runtime-env
    build:
      context: ../services/config-service
      dockerfile: Dockerfile
      args:
        <<: *build-args
    ports:
      - "8084:8084"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: config
      DB_USER: platform
      DB_PASSWORD: ${DB_PASSWORD:-platform}
    depends_on:
      postgres:
        condition: service_healthy

  policy:
    <<: *runtime-env
    build:
      context: ../services/policy-service
      dockerfile: Dockerfile
      args:
        <<: *build-args
    ports:
      - "8085:8085"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: policy
      DB_USER: platform
      DB_PASSWORD: ${DB_PASSWORD:-platform}
    depends_on:
      postgres:
        condition: service_healthy

  secrets:
    <<: *runtime-env
    build:
      context: ../services/secrets-service
      dockerfile: Dockerfile
      args:
        <<: *build-args
    ports:
      - "8087:8087"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: secrets
      DB_USER: platform
      DB_PASSWORD: ${DB_PASSWORD:-platform}
    depends_on:
      postgres:
        condition: service_healthy

  audit:
    <<: *runtime-env
    build:
      context: ../services/audit-service
      dockerfile: Dockerfile
      args:
        <<: *build-args
    ports:
      - "8086:8086"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: audit
      DB_USER: platform
      DB_PASSWORD: ${DB_PASSWORD:-platform}
    depends_on:
      postgres:
        condition: service_healthy

  iam:
    <<: *runtime-env
    build:
      context: ../services/iam-service
      dockerfile: Dockerfile
      args:
        <<: *build-args
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: iam
      DB_USER: platform
      DB_PASSWORD: ${DB_PASSWORD:-platform}
      CONFIG_SERVICE_ENABLED: "true"
      CONFIG_SERVICE_URL: http://config:8084/v1/config
      OIDC_GOOGLE_REDIRECT_URI: ${OIDC_GOOGLE_REDIRECT_URI:-http://localhost:8080/v1/iam/auth/oidc/google/callback}
      OIDC_GITHUB_REDIRECT_URI: ${OIDC_GITHUB_REDIRECT_URI:-http://localhost:8080/v1/iam/auth/oidc/github/callback}
    depends_on:
      postgres:
        condition: service_healthy
      config:
        condition: service_started

  mcp:
    <<: *runtime-env
    build:
      context: ../services/mcp-gateway
      dockerfile: Dockerfile
      args:
        <<: *build-args
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: mcp
      DB_USER: platform
      DB_PASSWORD: ${DB_PASSWORD:-platform}
      POLICY_SERVICE_ENABLED: "true"
      POLICY_SERVICE_URL: http://policy:8085/v1/policy
      SECRETS_SERVICE_ENABLED: "true"
      SECRETS_SERVICE_URL: http://secrets:8087/v1/secrets
      AUDIT_SERVICE_ENABLED: "true"
      AUDIT_SERVICE_URL: http://audit:8086/v1/audit
    depends_on:
      postgres:
        condition: service_healthy
      policy:
        condition: service_started
      secrets:
        condition: service_started
      audit:
        condition: service_started

  knowledge:
    build:
      context: ../services/knowledge-service
      dockerfile: Dockerfile
      args:
        <<: *build-args
    ports:
      - "8088:8088"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: knowledge
      DB_USER: platform
      DB_PASSWORD: ${DB_PASSWORD:-platform}
    depends_on:
      postgres:
        condition: service_healthy

  ai:
    <<: *runtime-env
    build:
      context: ../services/ai-runtime
      dockerfile: Dockerfile
      args:
        <<: *build-args
    ports:
      - "8083:8083"
    environment:
      POLICY_SERVICE_ENABLED: "true"
      POLICY_SERVICE_URL: http://policy:8085/v1/policy
      AUDIT_SERVICE_ENABLED: "true"
      AUDIT_SERVICE_URL: http://audit:8086/v1/audit
    depends_on:
      - iam
      - policy
      - audit

  bff:
    build:
      context: ../services/bff-gateway
      dockerfile: Dockerfile
      args:
        <<: *build-args
    ports:
      - "8082:8082"
    environment:
      IAM_BASE_URL: http://iam:8080/v1/iam
      MCP_BASE_URL: http://mcp:8081
      AI_BASE_URL: http://ai:8083
      POLICY_BASE_URL: http://policy:8085/v1/policy
      AUDIT_BASE_URL: http://audit:8086/v1/audit
      KNOWLEDGE_BASE_URL: http://knowledge:8088/v1/knowledge
    depends_on:
      - iam
      - mcp
      - ai
      - config
      - policy
      - audit
      - knowledge

volumes:
  pgdata:
